name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:supplemental
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-test
          path: packages/e2e/.logs
  criteria:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:criteria
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-criteria
          path: packages/e2e/.logs

  # docs/deployment.md §3. Gated on both test jobs: `needs` makes a red build
  # un-deployable, which is the whole point — there is no other deploy path
  # and no manual override.
  deploy:
    needs: [test, criteria]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deliberately NOT cancel-in-progress. The workflow-level group above
    # cancels superseded CI runs, which is right for tests and wrong for a
    # deploy: cancelling between `pull` and `up -d` would leave the server
    # holding a new image it never started. Two rapid pushes to main queue
    # here instead, and the later one wins by finishing last.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase path segments and the repository is
      # Thecow-007/BackBurner, so the name is lowercased rather than
      # hardcoded — this keeps working if the repo is ever renamed or forked.
      - name: Resolve image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags, both pointing at this commit's image: the immutable :<sha>
      # the server is told to run, and the moving :main tag that
      # docker-compose.yml falls back to for manual operations on the box.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:main
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key, not StrictHostKeyChecking=no. Accepting any key
          # would let anything that can answer on that address receive the
          # deploy — and this step hands over shell access to the server.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The server's compose file is replaced from main on every deploy, so
      # "the deployed commit equals main HEAD" covers the topology too, not
      # just the image (docs/deployment.md §3).
      - name: Ship the compose file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          scp -i ~/.ssh/id_deploy docker-compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_DIR:-/opt/backburner}/docker-compose.yml"

      - name: Roll out
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          IMAGE: ${{ steps.img.outputs.name }}:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ${DEPLOY_DIR:-/opt/backburner} \
             && export APP_IMAGE='$IMAGE' \
             && docker compose pull \
             && docker compose --profile prod up -d \
             && docker image prune -f"

      # A deploy that leaves the app unhealthy is a failed deploy, and it must
      # go red here rather than be discovered on camera. The app's own
      # healthcheck already polls /health; this waits on that verdict.
      - name: Verify the rollout is healthy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ${DEPLOY_DIR:-/opt/backburner} && bash -s" <<'REMOTE'
          for i in $(seq 1 40); do
            cid="$(docker compose --profile prod ps -q app)"
            if [ -n "$cid" ]; then
              state="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)"
              echo "attempt $i: $state"
              [ "$state" = "healthy" ] && exit 0
              if [ "$state" = "unhealthy" ]; then
                echo "--- app logs ---"; docker logs --tail 50 "$cid"; exit 1
              fi
            else
              echo "attempt $i: no app container yet"
            fi
            sleep 3
          done
          echo "app did not become healthy within 120s"
          docker compose --profile prod ps
          cid="$(docker compose --profile prod ps -q app)"
          [ -n "$cid" ] && docker logs --tail 50 "$cid"
          exit 1
          REMOTE
