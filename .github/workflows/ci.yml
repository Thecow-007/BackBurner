name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:supplemental
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-test
          path: packages/e2e/.logs
  criteria:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:criteria
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-criteria
          path: packages/e2e/.logs

  # docs/deployment.md §3, ADR 0030. Delivery is split across two runners on
  # purpose: the image is built in the cloud, and the server only pulls it.
  #
  # Both halves are gated on `needs: [test, criteria]`, so a red suite makes
  # the deploy structurally unreachable — that gate is the entire point of
  # keeping these jobs in the test workflow rather than their own.

  # Cloud half. Builds and publishes; touches nothing of the operator's.
  publish:
    needs: [test, criteria]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase path segments and the repository is
      # Thecow-007/BackBurner, so the name is lowercased rather than
      # hardcoded — this keeps working if the repo is renamed or forked.
      - name: Resolve image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on the same image: the immutable :<sha> the server is told to
      # run, and the moving :main that docker-compose.yml falls back to for
      # manual operations on the box.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:main
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Server half. Runs on the self-hosted runner, so it needs no inbound
  # connectivity — which is what makes it work at all against a host that is
  # IPv6-native with a dynamic IPv4 (ADR 0030).
  #
  # Gated on the DEPLOY_ENABLED repository variable so the pipeline stays
  # green before the runner exists, and can be switched off without editing
  # this file — during a server migration, say.
  rollout:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, backburner-prod]
    # Bounded so an offline runner fails the run instead of queueing until the
    # workflow's own 6-hour ceiling.
    timeout-minutes: 15
    # Deliberately NOT cancel-in-progress. The workflow-level group cancels
    # superseded CI runs, which is right for tests and wrong for a rollout:
    # cancelling between `pull` and `up -d` would leave the server holding an
    # image it never started. Rapid pushes queue here, and the later wins.
    concurrency:
      group: rollout-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/backburner' }}
      IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # The job's own token, scoped to `packages: read` and valid only for
      # this run. No long-lived PAT is stored on the server, and the GHCR
      # package can stay private.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The compose file is refreshed from main on every rollout, so "the
      # deployed commit equals main HEAD" covers the topology, not just the
      # image. The deploy directory — not the runner workspace — stays the
      # source of truth, because that is where the operator's .env lives and
      # secrets must never enter a workspace Actions can clean or expose.
      - name: Sync the compose file
        run: |
          install -m 644 docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

      - name: Roll out
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          export APP_IMAGE="$IMAGE"
          docker compose pull
          docker compose --profile prod up -d
          docker image prune -f

      # A rollout that leaves the app unhealthy is a failed rollout, and it
      # must go red here rather than be discovered by a user.
      - name: Verify the rollout is healthy
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          for i in $(seq 1 40); do
            cid="$(docker compose --profile prod ps -q app)"
            if [ -n "$cid" ]; then
              state="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)"
              echo "attempt $i: $state"
              [ "$state" = "healthy" ] && exit 0
              if [ "$state" = "unhealthy" ]; then
                echo "--- app logs ---"; docker logs --tail 50 "$cid"; exit 1
              fi
            else
              echo "attempt $i: no app container yet"
            fi
            sleep 3
          done
          echo "app did not become healthy within 120s"
          docker compose --profile prod ps
          cid="$(docker compose --profile prod ps -q app)"
          [ -n "$cid" ] && docker logs --tail 50 "$cid"
          exit 1

      # Credentials must not outlive the job on a machine the operator also
      # uses. `always()` so this runs even when the rollout failed above.
      - name: Drop registry credentials
        if: always()
        run: docker logout ghcr.io || true
