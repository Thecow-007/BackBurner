# Adds the devcontainer's own service on top of the root docker-compose.yml
# (docs/architecture.md §3, docs/deployment.md §7). `postgres` is defined
# there; naming it explicitly in devcontainer.json's "runServices" starts it
# regardless of its "dev"/"prod" profile membership.
services:
  # Only in the devcontainer (dev/Codespaces) — never prod or the local root
  # compose: have Postgres create the dev database on first volume init so
  # `npm run migrate` works out of the box. POSTGRES_DB merges with the root
  # service's POSTGRES_PASSWORD and takes effect only on a fresh data volume.
  postgres:
    environment:
      POSTGRES_DB: backburner_dev

  devcontainer:
    # base:ubuntu has a native vscode user; Node arrives via the node feature
    # in devcontainer.json (installed system-wide, on PATH for vscode).
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    # No explicit workspace mount: Codespaces injects its own bind of the repo
    # at /workspaces/BackBurner, and adding our own nested mount at the same
    # path is what dropped creation into a recovery container. The dev-container
    # tooling provides the workspace mount from `workspaceFolder`.
    command: sleep infinity
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/backburner_dev
      # The test harnesses default to localhost:5432 (test-plan.md §3.2), which
      # is correct on a developer machine where compose publishes the port —
      # and wrong here, where Postgres is a sibling container reachable only by
      # service name. Without these, `npm test` in a Codespace dies with
      # ECONNREFUSED 127.0.0.1:5432 while every other documented command works,
      # which is a confusing way to discover that the test suite was never
      # runnable in the environment the spec requires it to run in.
      #
      # These are the exact override variables test-plan.md §8 documents for
      # pointing the suites at a non-default server; the devcontainer simply
      # has to set them. Each harness still creates and migrates its own
      # database, so dev data is untouched.
      ENGINE_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/backburner_test_engine
      E2E_DATABASE_URL: postgres://postgres:postgres@postgres:5432/backburner_test_e2e
